databaseChangeLog:
  - changeSet:
      id: 010-create-messages-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: responded_applicants_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: responded_applicants_id
            referencedTableName: responded_applicants
            referencedColumnNames: id
            constraintName: fk_message_responded_applicant_id
            onDelete: CASCADE

        - createIndex:
            tableName: messages
            indexName: idx_messages_responded_applicants_id
            columns:
              - column:
                  name: responded_applicants_id

        - createIndex:
            tableName: messages
            indexName: idx_messages_sent_at
            columns:
              - column:
                  name: sent_at