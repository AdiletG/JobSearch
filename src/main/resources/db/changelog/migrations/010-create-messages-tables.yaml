databaseChangeLog:
  - changeSet:
      id: 010-create-messages-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: responded_applicants_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
              - column:
                  name: times
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: responded_applicants_id
            referencedTableName: responded_applicants
            referencedColumnNames: id
            constraintName: fk_message_responded_applicant_id
            onDelete: CASCADE