databaseChangeLog:
  - changeSet:
      id: 003-create-vacancies-table
      author: AdiletG
      changes:
        - createTable:
            tableName: vacancies
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: numeric(10,2)
              - column:
                  name: exp_from
                  type: int
              - column:
                  name: exp_to
                  type: int
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: date
                  defaultValueComputed: CURRENT_DATE
                  constraints:
                    nullable: false
              - column:
                  name: update_date
                  type: date

        - addForeignKeyConstraint:
            constraintName: fk_vacancy_category_id
            baseTableName: vacancies
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_vacancy_author_id
            baseTableName: vacancies
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT

        - sql:
            sql: "ALTER TABLE vacancies ADD CONSTRAINT chk_vacancies_salary CHECK (salary IS NULL OR salary >= 0);"

        - sql:
            sql: "ALTER TABLE vacancies ADD CONSTRAINT chk_vacancies_exp_from CHECK (exp_from IS NULL OR exp_from >= 0);"

        - sql:
            sql: "ALTER TABLE vacancies ADD CONSTRAINT chk_vacancies_exp_to CHECK (exp_to IS NULL OR exp_to >= 0);"

        - sql:
            sql: "ALTER TABLE vacancies ADD CONSTRAINT chk_vacancies_exp_range CHECK (exp_from IS NULL OR exp_to IS NULL OR exp_from <= exp_to);"

        - createIndex:
            tableName: vacancies
            indexName: idx_vacancies_category_id
            columns:
              - column:
                  name: category_id

        - createIndex:
            tableName: vacancies
            indexName: idx_vacancies_author_id
            columns:
              - column:
                  name: author_id

        - createIndex:
            tableName: vacancies
            indexName: idx_vacancies_is_active
            columns:
              - column:
                  name: is_active