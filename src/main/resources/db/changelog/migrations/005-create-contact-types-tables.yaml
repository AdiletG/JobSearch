databaseChangeLog:
  - changeSet:
      id: 005-create-contact-types-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: contact_types
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: varchar(100)
                  constraints:
                    nullable: false