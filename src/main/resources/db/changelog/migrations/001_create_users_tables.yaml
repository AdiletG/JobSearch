databaseChangeLog:
  - changeSet:
      id: 001-create-user-table
      author: AdiletG
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: varchar(100)
              - column:
                  name: age
                  type: int
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(55)
              - column:
                  name: avatar
                  type: text
              - column:
                  name: account_type
                  type: varchar(50)
                  constraints:
                    nullable: false

        - sql:
            sql: "ALTER TABLE users ADD CONSTRAINT chk_account_type CHECK (account_type IN ('EMPLOYER', 'APPLICANT', 'ADMIN'));"
