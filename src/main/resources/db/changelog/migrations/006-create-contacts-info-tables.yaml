databaseChangeLog:
  - changeSet:
      id: 006-create-contacts-info-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: contacts_info
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: resume_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: contact_value
                  type: text
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: contacts_info
            baseColumnNames: type_id
            referencedTableName: contact_types
            referencedColumnNames: id
            constraintName: fk_contact_info_type_id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: contacts_info
            baseColumnNames: resume_id
            referencedTableName: resumes
            referencedColumnNames: id
            constraintName: fk_contacts_info_resume_id
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: contacts_info
            columnNames: resume_id, type_id
            constraintName: uq_contacts_info_resume_type

        - createIndex:
            tableName: contacts_info
            indexName: idx_contacts_info_resume_id
            columns:
              - column:
                  name: resume_id

        - createIndex:
            tableName: contacts_info
            indexName: idx_contacts_info_type_id
            columns:
              - column:
                  name: type_id