databaseChangeLog:
  - changeSet:
      id: 016
      author: AdiletG
      changes:
        - createTable:
            tableName: role_auth
            columns:
              - column:
                  name: role_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: auth_id
                  type: long
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: role_auth
            columnNames: role_id, auth_id
            constraintName: pk_role_auth

        - addForeignKeyConstraint:
            baseTableName: role_auth
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_auth_role

        - addForeignKeyConstraint:
            baseTableName: role_auth
            baseColumnNames: auth_id
            referencedTableName: authorities
            referencedColumnNames: id
            constraintName: fk_role_auth_authority