databaseChangeLog:
  - changeSet:
      id: 007-create-responded-applicant-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: responded_applicants
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: vacancy_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: responded_applicants
            baseColumnNames: resume_id
            referencedTableName: resumes
            referencedColumnNames: id
            constraintName: fk_responded_resume_id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: responded_applicants
            baseColumnNames: vacancy_id
            referencedTableName: vacancies
            referencedColumnNames: id
            constraintName: fk_responded_vacancy_id
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: responded_applicants
            columnNames: resume_id, vacancy_id
            constraintName: uq_responded_applicants_resume_vacancy

        - sql:
            sql: "ALTER TABLE responded_applicants ADD CONSTRAINT chk_responded_applicants_status CHECK (status IN ('PENDING', 'ACCEPTED', 'REJECTED'));"

        - createIndex:
            tableName: responded_applicants
            indexName: idx_responded_applicants_resume_id
            columns:
              - column:
                  name: resume_id

        - createIndex:
            tableName: responded_applicants
            indexName: idx_responded_applicants_vacancy_id
            columns:
              - column:
                  name: vacancy_id

        - createIndex:
            tableName: responded_applicants
            indexName: idx_responded_applicants_status
            columns:
              - column:
                  name: status