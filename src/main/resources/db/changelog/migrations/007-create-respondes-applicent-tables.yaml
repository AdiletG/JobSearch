databaseChangeLog:
  - changeSet:
      id: 007-create-responded-applicant-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: responded_applicants
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: vacancy_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: confirmation
                  type: boolean
        - addForeignKeyConstraint:
            baseTableName: responded_applicants
            baseColumnNames: resume_id
            referencedTableName: resumes
            referencedColumnNames: id
            constraintName: fk_responded_resume_id
            onDelete: SET NULL

        - addForeignKeyConstraint:
            baseTableName: responded_applicants
            baseColumnNames: vacancy_id
            referencedTableName: vacancies
            referencedColumnNames: id
            constraintName: fk_responded_vacancy_id
            onDelete: SET NULL