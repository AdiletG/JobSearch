databaseChangeLog:
  - changeSet:
      id: 002-create-categories-table
      author: AdiletG
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: long

        - addForeignKeyConstraint:
            constraintName: fk_categories_parent_id
            baseTableName: categories
            baseColumnNames: parent_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: SET NULL

        - createIndex:
            tableName: categories
            indexName: idx_categories_parent_id
            columns:
              - column:
                  name: parent_id