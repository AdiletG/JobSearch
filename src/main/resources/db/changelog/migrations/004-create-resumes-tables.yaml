databaseChangeLog:
  - changeSet:
      id: 004-create-resumes-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: resumes
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: applicant_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: numeric(10,2)
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: date
                  defaultValueComputed: CURRENT_DATE
                  constraints:
                    nullable: false
              - column:
                  name: update_date
                  type: date

        - addForeignKeyConstraint:
            constraintName: fk_resume_category_id
            baseTableName: resumes
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_resume_applicant_id
            baseTableName: resumes
            baseColumnNames: applicant_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT

        - sql:
            sql: "ALTER TABLE resumes ADD CONSTRAINT chk_resumes_salary CHECK (salary IS NULL OR salary >= 0);"

        - createIndex:
            tableName: resumes
            indexName: idx_resumes_applicant_id
            columns:
              - column:
                  name: applicant_id

        - createIndex:
            tableName: resumes
            indexName: idx_resumes_category_id
            columns:
              - column:
                  name: category_id

        - createIndex:
            tableName: resumes
            indexName: idx_resumes_is_active
            columns:
              - column:
                  name: is_active