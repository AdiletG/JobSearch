databaseChangeLog:
  - changeSet:
      id: 004-create-resumes-tables
      author: AdiletG
      changes:
        - createTable:
            tableName: resumes
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: applicant_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: long
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: numeric(10, 2)
              - column:
                  name: is_active
                  type: boolean
              - column:
                  name: created_date
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_date
                  type: timestamp

        - addForeignKeyConstraint:
            constraintName: fk_resume_category_id
            baseTableName: resumes
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_resume_applicant_id
            baseTableName: resumes
            baseColumnNames: applicant_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT